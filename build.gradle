plugins {
    id 'application'
}

repositories {
    mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
        vendor = JvmVendorSpec.AMAZON
    }
}

dependencies {
    testImplementation platform('org.junit:junit-bom:6.0.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

def jdkVersion = javaToolchains.launcherFor(java.toolchain).map { it.metadata.javaRuntimeVersion }
def verifyJdk = tasks.register('verifyJdk') {
    inputs.property('jdkVersion', jdkVersion)
    doLast {
        String version = inputs.properties.jdkVersion
        if (Runtime.Version.parse(version).version() != [25, 0, 4]) {
            throw new GradleException("Set the Gradle JVM to Amazon Corretto 25.0.4 (found ${version}).")
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    dependsOn verifyJdk
    options.encoding = 'UTF-8'
    options.release = 25
}

tasks.named('test', Test) {
    useJUnitPlatform()
    testLogging {
        events 'failed'
        exceptionFormat = 'short'
    }
}

application {
    mainClass = 'edu.example.eventdesk.EventDeskDemo'
}
